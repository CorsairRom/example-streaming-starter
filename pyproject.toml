[project]
name = "cconecta-streaming-starter"
version = "v0.1.0"
description = "Minimal FastAPI receiver for stream lifecycle events (LIVE / DEFERRED)"
readme = "README.md"
requires-python = "~=3.12.0"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
