<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #1c2230;
        --muted: #5b6478;
        --line: #dfe3eb;
        --accent: #0f62fe;
        --danger: #b42318;
        --ok: #067647;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12151c;
          --card: #1a1f29;
          --text: #e6e9f0;
          --muted: #9aa4b8;
          --line: #2b3242;
          --accent: #6ea0ff;
          --danger: #ff8a80;
          --ok: #6ee7a8;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 20px 64px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 1px 2px rgb(0 0 0 / 4%);
      }
      .card + .card { margin-top: 20px; }
      h1 { font-size: 1.5rem; margin: 0 0 4px; }
      h2 { font-size: 1.1rem; margin: 0 0 16px; }
      p { margin: 0 0 12px; }
      .muted { color: var(--muted); font-size: 0.9rem; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
      label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      button {
        padding: 10px 16px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        color: inherit;
        border-color: var(--line);
      }
      button.danger { background: var(--danger); }
      table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
      th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
      code, .key {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        display: block;
        word-break: break-all;
        font-size: 0.95rem;
      }
      .badge { font-size: 0.78rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
      .badge.active { color: var(--ok); border-color: currentcolor; }
      .badge.revoked { color: var(--danger); border-color: currentcolor; }
      .error { color: var(--danger); margin-bottom: 12px; }
      .warn { border-left: 4px solid var(--danger); padding-left: 12px; margin-bottom: 16px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
      .topbar form { margin: 0; }
      .actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .actions form { margin: 0; }
      .actions button { padding: 6px 10px; font-size: 0.85rem; }
      a { color: var(--accent); }
      .stack > * + * { margin-top: 16px; }
      .login { max-width: 420px; margin: 80px auto; }
    </style>
    {% block head %}{% endblock %}
  </head>
  <body>
    <main>
      {% block content %}{% endblock %}
      <p class="muted" style="margin-top: 24px">
        {{ app_name }} · {{ app_version }} ·
        <a href="/docs">Documentación de la API</a> ·
        <a href="/health">Estado del servicio</a>
      </p>
    </main>
  </body>
</html>
